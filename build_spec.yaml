version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Install Dependencies
    command: |
      chmod +x mvnw
      ./mvnw clean package -DskipTests

  - type: Command
    name: Regression Testing
    command: |
      ./mvnw test

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
