version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Setup Environment
    command: |
      echo "Checking Java & Maven..."
      java -version || echo "Java missing"
      mvn -version || echo "Maven missing"

  - type: Command
    name: Install Maven (if missing)
    command: |
      apt-get update
      apt-get install -y maven

  - type: Command
    name: Build Project
    command: |
      if [ -f mvnw ]; then
        chmod +x mvnw
        ./mvnw -B clean package
      else
        mvn -B clean package
      fi

  - type: Command
    name: Check Output
    command: |
      ls -lah target

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
