version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Build without tests
    commandSpec:
      script: |
        chmod +x mvnw
        ./mvnw clean install -DskipTests

  - type: Command
    name: Regression Testing
    commandSpec:
      script: |
        ./mvnw test

  - type: Command
    name: Package
    commandSpec:
      script: |
        ./mvnw package

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
