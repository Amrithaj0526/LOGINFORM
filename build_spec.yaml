version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Debug
    command: |
      echo "Checking commands..."
      which java || echo "Java not found"
      which mvn || echo "Maven not found"
      ls -l

  - type: Command
    name: Build
    command: |
      if [ -f ./mvnw ]; then
        echo "Using Maven Wrapper"
        chmod +x mvnw
        ./mvnw -B clean package
      else
        echo "mvnw not found, trying mvn"
        mvn -B clean package
      fi

  - type: Command
    name: Verify
    command: |
      ls -lah target

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
        chmod +x mvnw
        ./mvnw -B clean package
      else
        mvn -B clean package
      fi

  - type: Command
    name: Check Output
    command: |
      ls -lah target

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
