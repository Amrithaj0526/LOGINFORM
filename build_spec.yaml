version: 0.1
component: build
timeoutInSeconds: 3600
shell: bash
failImmediatelyOnError: true

steps:
  - type: Command
    name: Build, test, and package
    command: |
      if [ -f mvnw ]; then
        chmod +x mvnw
        ./mvnw -B clean package
      else
        mvn -B clean package
      fi
      ls -lah target

outputArtifacts:
  - name: loginform-jar
    type: BINARY
    location: target/*.jar
